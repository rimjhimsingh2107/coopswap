global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: coopswap-api
    # both api replicas from docker-compose; metrics port isn't published to the host
    static_configs:
      - targets: ['api-1:9464', 'api-2:9464']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
