name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  FORCE_COLOR: 1

jobs:
  lint:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: shared
        run: pnpm --filter @coopswap/shared test
      - name: api (no database)
        run: pnpm --filter @coopswap/api test:unit
      - name: web
        run: pnpm --filter @coopswap/web test

  integration:
    name: API integration (postgres + redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: coopswap
          POSTGRES_PASSWORD: coopswap
          POSTGRES_DB: coopswap_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coopswap" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://coopswap:coopswap@localhost:5432/coopswap_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # migrations run in vitest global setup; this also covers the concurrency
      # suite and the tests that spawn several api processes
      - run: pnpm --filter @coopswap/api test:integration
      - name: Migrations apply cleanly to an empty database and are idempotent
        env:
          DATABASE_URL: postgres://coopswap:coopswap@localhost:5432/postgres
        run: |
          psql "$DATABASE_URL" -c 'create database migrate_check'
          export DATABASE_URL=postgres://coopswap:coopswap@localhost:5432/migrate_check
          SESSION_SECRET=ci-secret-ci-secret-ci-secret-ci-secret pnpm --filter @coopswap/api db:migrate
          SESSION_SECRET=ci-secret-ci-secret-ci-secret-ci-secret pnpm --filter @coopswap/api db:migrate | grep 'nothing to migrate'

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @coopswap/shared build && pnpm --filter @coopswap/api build && pnpm --filter @coopswap/web build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            packages/shared/dist
            apps/api/dist
            apps/web/dist
          retention-days: 3

  e2e:
    name: E2E (playwright)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: coopswap
          POSTGRES_PASSWORD: coopswap
          POSTGRES_DB: coopswap
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coopswap" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgres://coopswap:coopswap@localhost:5432/coopswap
      REDIS_URL: redis://localhost:6379
      SMTP_URL: smtp://localhost:1025
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: build }
      - name: Migrate
        run: node apps/api/dist/db/migrate.js
        env:
          MIGRATIONS_DIR: database/migrations
          SESSION_SECRET: e2e-secret-e2e-secret-e2e-secret-123
      - name: Install chromium
        run: pnpm --filter @coopswap/e2e exec playwright install --with-deps chromium
      - name: Run
        run: pnpm --filter @coopswap/e2e test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          load: true
          tags: coopswap-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Smoke test the api image
        if: matrix.app == 'api'
        # just checks the built image can load the app (native modules, shared package, etc)
        run: >
          docker run --rm
          -e SESSION_SECRET=smoke-secret-smoke-secret-smoke-secret
          -e DATABASE_URL=postgres://x:y@localhost/z
          coopswap-api:ci node -e "import('./dist/app.js').then(() => { console.log('imports ok'); process.exit(0) })"
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: coopswap-${{ matrix.app }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm audit --prod --audit-level high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
